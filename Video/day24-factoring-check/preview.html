<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>Day 24 試作播放器</title><style>body{background:#181818;color:white;font:16px system-ui;margin:0;display:flex;flex-direction:column;align-items:center}#box{width:360px;height:640px;overflow:hidden;margin:16px}iframe{width:1080px;height:1920px;transform:scale(.3333333);transform-origin:0 0;border:0}button,input{margin:8px}p{max-width:650px;padding:0 20px}</style><h2>Day 24｜拿發票來融資，接著查誰？</h2><div id="box"><iframe id="film" src="index.html"></iframe></div><div><button id="play">播放／暫停</button><input id="seek" type="range" min="0" max="58.629" step=".05" value="0"><span id="time">0 / 58.6 秒</span></div><p>本機試作：教學假設案例。播放時會有繁體中文合成旁白；按暫停可審查文字與圖解。</p><script>const f=document.getElementById('film'),seek=document.getElementById('seek');let playing=false,at=0,stamp=0;function update(t){const w=f.contentWindow;if(!w.__timelines)return;w.__timelines.main.seek(t);w.document.querySelectorAll('.clip').forEach(e=>{let s=+e.dataset.start,d=+e.dataset.duration;e.style.opacity=t>=s&&t<s+d?'1':'0'});seek.value=t;document.getElementById('time').textContent=t.toFixed(1)+' / 58.6 秒'}f.onload=()=>update(0);document.getElementById('play').onclick=()=>{const a=f.contentDocument.getElementById('narration');playing=!playing;if(playing){if(at>=58.629-.05)at=0;a.currentTime=at;a.play();stamp=performance.now()}else a.pause()};seek.oninput=()=>{at=+seek.value;update(at);f.contentDocument.getElementById('narration').currentTime=at};function tick(t){if(playing){at=f.contentDocument.getElementById('narration').currentTime;update(at);if(at>=58.629-.03)playing=false}requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></html>
